<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Player — SkillShare</title>
<link rel="stylesheet" href="explore-skills.css">
<link rel="stylesheet" href="components/profile-dropdown.css">
<script src="config.js"></script>
<script src="api-client.js"></script>
<script src="auth.js"></script>
<script src="components/profile-dropdown.js"></script>
<script src="thumbnails.js"></script>
</head>
<body data-page="learning-player.html" data-role="student">
<div id="app-sidebar"></div>
<div class="app-main">
<div id="app-topbar"></div>
<main class="page-content">
<p class="muted"><a href="explore-skills.html" style="color:#93c5fd">← Explore</a> <span id="crumbCourse"></span></p>
<div id="plLoading" class="state-card"><p class="muted">Loading lecture...</p></div>
<div id="plError" class="state-card center" hidden><h2>Lecture unavailable.</h2><p class="muted" id="plErrorMsg"></p><a class="btn primary" href="explore-skills.html">Explore Skills</a></div>
<div id="plApp" hidden>
<section class="panel"><div style="padding:18px">
<div id="plMeta"></div>
<div id="plVideoWrap" style="margin:12px 0"></div>
<div class="bar"><div id="plBar" style="width:0%"></div></div>
<p class="muted" id="plStats">0 / 0 · 0%</p>
<p class="muted small" id="plNote"></p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
<button class="btn primary" id="plExt" type="button" hidden>I completed this external course</button>
<a class="btn ghost" href="my-learning.html">Open My Learning</a>
<a class="btn ghost" id="plOpenSource" target="_blank" rel="noopener">Open source</a>
</div>
</div></section>
<section class="panel"><div class="panel-head"><div><h2>Up next</h2><p class="muted">Related lectures</p></div></div><div id="plRelated" class="card-grid"></div></section>
</div>
</main>
</div>
<div id="toast" role="status"></div>
<script src="portal-shell.js"></script>
<script src="portal.js"></script>
<script src="learning-player.js"></script>
</body>
</html>
