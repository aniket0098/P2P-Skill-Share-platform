<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Calendar | SkillShare</title>
    <link rel="stylesheet" href="calendar.css">
    <script src="calendar.js" defer></script>
</head>

<body>
    <header class="app-head"><a class="app-brand" href="dashboard.html"><b>◇</b>SkillShare</a>
        <nav class="app-nav"><a href="dashboard.html">Dashboard</a><a href="explore.html">Explore</a><a
                href="my-learning.html">Learning</a><a href="my-teaching.html">Teaching</a></nav>
        <div class="head-right"><a href="notifications.html" class="bell">♧<i>0</i></a><a href="profile.html"><img
                    src="" alt="Profile"></a></div>
    </header>
    <main class="page">
        <div class="page-heading">
            <div>
                <h1>Your calendar</h1>
                <p>All your upcoming learning and teaching sessions in one place.</p>
            </div><a class="primary" href="create-session.html">＋ Create a session</a>
        </div>
        <section class="cal-layout">
            <article class="card calendar-scroll">
                <div class="calendar-head">
                    <h2>August 2026</h2>
                    <div class="month-nav"><button>←</button><button>→</button></div>
                </div>
                <div class="week">
                    <div class="day"></div>
                    <div class="day">Mon 17</div>
                    <div class="day">Tue 18</div>
                    <div class="day">Wed 19</div>
                    <div class="day">Thu 20</div>
                    <div class="day">Fri 21</div>
                    <div class="time">10:00</div>
                    <div></div>
                    <div>
                        <div class="event"></div>
                    </div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div class="time">14:00</div>
                    <div></div>
                    <div></div>
                    <div>
                        <div class="event cyan"></div>
                    </div>
                    <div></div>
                    <div></div>
                    <div class="time">18:00</div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div>
                        <div class="event"></div>
                    </div>
                    <div></div>
                </div>
            </article>
            <aside class="card upcoming"><div class="empty-state">Upcoming sessions will appear here once connected to the backend.</div></aside>
        </section>
    </main>
</body>

</html>
