<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Connections | SkillShare</title>
    <link rel="stylesheet" href="requests.css?v=4">
    <script src="api-client.js"></script>
    <script src="requests.js?v=4" defer></script>
</head>

<body>
    <header class="app-head"><a class="app-brand" href="dashboard.html"><b>◇</b>SkillShare</a>
        <nav class="app-nav"><a href="dashboard.html">Dashboard</a><a href="explore.html">Explore</a><a
                href="my-learning.html">Learning</a><a href="my-teaching.html">Teaching</a></nav>
        <div class="head-right"><a href="notifications.html" class="bell">♧<i id="bellCount">0</i></a><a href="profile.html"><img
                    src="assets/ankit.svg" alt="Profile"></a></div>
    </header>
    <main class="page">
        <div class="page-heading">
            <div>
                <h1>Connections</h1>
                <p>Manage your incoming and outgoing connection requests.</p>
            </div>
            <div class="heading-actions">
                <button class="outline" id="refreshBtn" type="button">⟳ Refresh</button>
                <button class="primary" id="findPeopleBtn" type="button">＋ Find People</button>
            </div>
        </div>
        <div class="tabs"><button class="active" data-tab="incoming">Received <span>0</span></button><button
                data-tab="outgoing">Sent <span>0</span></button><button data-tab="connections">Connections
                <span>0</span></button><button data-tab="discover">Find People</button></div>
        <section id="incoming" class="tab-panel active cards">
            <!-- Rendered from GET /api/requests (PostgreSQL) -->
        </section>
        <section id="outgoing" class="tab-panel cards">
            <!-- Rendered from GET /api/requests (PostgreSQL) -->
        </section>
        <section id="connections" class="tab-panel cards">
            <!-- Rendered from GET /api/requests/connections (PostgreSQL) -->
        </section>
        <section id="discover" class="tab-panel">
            <div class="people-search-wrap">
                <div class="people-search card">
                    <span class="search-icon">⌕</span>
                    <input id="peopleSearch" type="text" autocomplete="off"
                        placeholder="Search people by name, skill or interest...">
                    <span class="search-clear" id="peopleSearchClear" title="Clear">×</span>
                </div>
                <div id="peopleSuggestions" class="people-suggestions"></div>
            </div>
            <div id="peopleResults" class="cards">
                <!-- Rendered from GET /api/users / /api/users/search (PostgreSQL) -->
            </div>
        </section>
    </main>
    <div id="toast" class="toast"></div>
</body>

</html>
