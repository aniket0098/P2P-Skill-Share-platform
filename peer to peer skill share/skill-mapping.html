<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Mapping — SkillShare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="portal.css">

<body data-page="skill-mapping.html" data-role="student">
<div id="app-sidebar"></div><div class="app-main"><div id="app-topbar"></div>
<main class="page-content">
<!-- TODO: Replace with backend API data -->
<header class="portal-head"><span class="eyebrow">Career · gap analysis</span>
<h1>Skill <span>Mapping</span></h1><p id="sm-source">Backend-calculated readiness from your real skills.</p></header>
<section class="grid-3">
<div class="panel stat-card"><div class="stat-top"><span class="stat-icon">🎯</span></div><b id="sm-role-name">—</b><span>Target role</span><div class="mt"><select id="sm-role" aria-label="Target role"></select> <button class="btn small" id="sm-save-role">Save</button></div></div>
<div class="panel stat-card"><div class="stat-top"><span class="stat-icon">📊</span></div><b id="sm-score">—</b><span id="sm-level">Readiness</span><p class="muted" id="sm-reason"></p></div>
<div class="panel stat-card"><div class="stat-top"><span class="stat-icon">🧩</span></div><b id="sm-gap-count">—</b><span>To close</span><a class="btn small ghost" href="my-learning.html">Explore Learning</a></div>
</section>
<div id="sm-state" class="mt"></div>
<div class="grid-2 mt">
<section class="panel"><div class="section-head"><h2>Your skills</h2></div>
<div class="row-list" id="sm-mine"></div></section>
<section class="panel"><div class="section-head"><h2>Role requirements</h2></div>
<div class="row-list" id="sm-req"></div></section>
</div>
<div class="grid-2 mt">
<section class="panel"><div class="section-head"><h2>Skill gap</h2></div>
<div class="row-list" id="sm-gaps"></div></section>
<section class="panel"><div class="section-head"><h2>Recommended next skills</h2><a href="my-learning.html">Learn →</a></div>
<div class="row-list" id="sm-recs"></div></section>
</div>
</main></div><div id="toast-root"></div>
